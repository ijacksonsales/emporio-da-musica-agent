[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-agent"
version = "0.1.0"
description = "Customer service agent prototype for Empório da Música (Artefact AI Engineer challenge)"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.30",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "streamlit>=1.50",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emporio_agent = ["prompts/*.md", "policies/sections/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
